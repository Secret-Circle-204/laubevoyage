<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Incompatible | L'Aube Voyage</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #231F20;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #A7AAAC;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }
    .logo {
      font-family: serif;
      font-size: 28px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #FFFFFF;
      margin-bottom: 30px;
      font-weight: 300;
    }
    .logo span {
      color: #00AEEF;
    }
    h1 {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 300;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }
    p {
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background-color: #F58220;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #00AEEF;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">L'AUBE <span>VOYAGE</span></div>
    <h1>Browser Incompatible</h1>
    <p>
      L'Aube Voyage requires a modern browser to deliver a bespoke, premium travel experience.
      Internet Explorer is no longer supported. Please upgrade to a modern browser like Google Chrome, Apple Safari, or Microsoft Edge.
    </p>
    <a href="https://www.google.com/chrome/" class="btn" target="_blank" rel="noopener noreferrer">Get Chrome</a>
  </div>
</body>
</html>
